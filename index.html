<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOJI — 7th Anniversary</title>
<meta name="description" content="Tujuh tahun SOJI Skin Clinic &amp; Library. Cerita perjalanan, filosofi, layanan, dan perayaan tujuh tahun merawat kulit.">
<meta name="theme-color" content="#FBF7F2">

<meta property="og:type" content="website">
<meta property="og:title" content="SOJI — 7th Anniversary">
<meta property="og:description" content="Tujuh tahun merawat kulit, merawat cerita.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232A211C'/><text x='50' y='70' font-size='58' font-family='Georgia,serif' fill='%23B98E4C' text-anchor='middle'>7</text></svg>">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<a class="skip" href="#cerita">Lewati ke konten</a>

<!-- ============ HEADER ============ -->
<header class="site-header" id="siteHeader">
  <div class="shell header-inner">
    <a class="logo" href="#top" aria-label="SOJI beranda">
      <span class="logo-mark">SOJI</span>
      <span class="logo-sub" data-brand-tagline></span>
    </a>

    <nav class="nav" id="nav" aria-label="Navigasi utama">
      <ul data-nav></ul>
    </nav>

    <a class="btn btn-sm btn-solid header-cta" href="#kontak">Booking</a>

    <button class="burger" id="burger" aria-expanded="false" aria-controls="nav" aria-label="Buka menu">
      <span></span><span></span>
    </button>
  </div>
</header>

<main id="top">

  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="shell hero-inner">

      <div class="hero-copy">
        <p class="eyebrow reveal" data-hero-eyebrow></p>
        <h1 class="hero-title reveal" data-hero-title></h1>
        <p class="lead reveal" data-hero-body></p>
        <div class="hero-actions reveal">
          <a class="btn btn-solid" data-hero-cta1></a>
          <a class="btn btn-ghost" data-hero-cta2></a>
        </div>
        <p class="hero-meta reveal"><span data-brand-periode></span> <i>·</i> <span data-brand-kota></span></p>
      </div>

      <div class="hero-mark reveal" aria-hidden="true">
        <div class="seven">7</div>
        <div class="seven-ring"></div>
        <p class="seven-label">Years of SOJI</p>
      </div>

    </div>
    <div class="scroll-hint" aria-hidden="true"><span></span></div>
  </section>

  <!-- ============ PROLOG ============ -->
  <section class="section section-prolog" id="cerita">
    <div class="shell narrow">
      <p class="eyebrow reveal" data-prolog-eyebrow></p>
      <h2 class="h2 reveal" data-prolog-title></h2>
      <div class="prose" data-prolog-body></div>
      <blockquote class="pull reveal" data-prolog-pull></blockquote>
    </div>
  </section>

  <!-- ============ TIMELINE ============ -->
  <section class="section section-alt" id="perjalanan">
    <div class="shell">
      <header class="sec-head">
        <p class="eyebrow reveal" data-timeline-eyebrow></p>
        <h2 class="h2 reveal" data-timeline-title></h2>
      </header>
      <ol class="timeline" data-timeline></ol>
    </div>
  </section>

  <!-- ============ MILESTONES ============ -->
  <section class="section section-dark" id="angka">
    <div class="shell">
      <p class="eyebrow eyebrow-light reveal" data-ms-eyebrow></p>
      <div class="stats" data-milestones></div>
      <p class="footnote" data-ms-note></p>
    </div>
  </section>

  <!-- ============ FILOSOFI ============ -->
  <section class="section" id="filosofi">
    <div class="shell">
      <header class="sec-head">
        <p class="eyebrow reveal" data-pillars-eyebrow></p>
        <h2 class="h2 reveal" data-pillars-title></h2>
      </header>
      <div class="pillars" data-pillars></div>
    </div>
  </section>

  <!-- ============ LAYANAN ============ -->
  <section class="section section-alt" id="layanan">
    <div class="shell">
      <header class="sec-head">
        <p class="eyebrow reveal" data-services-eyebrow></p>
        <h2 class="h2 reveal" data-services-title></h2>
      </header>
      <div class="services" data-services></div>
    </div>
  </section>

  <!-- ============ TESTIMONI ============ -->
  <section class="section" id="suara">
    <div class="shell">
      <header class="sec-head">
        <p class="eyebrow reveal" data-voices-eyebrow></p>
        <h2 class="h2 reveal" data-voices-title></h2>
      </header>
      <div class="voices" data-voices></div>
    </div>
  </section>

  <!-- ============ ANNIVERSARY ============ -->
  <section class="section section-gold" id="anniversary">
    <div class="shell">
      <header class="sec-head sec-head-center">
        <p class="eyebrow reveal" data-anniv-eyebrow></p>
        <h2 class="h2 reveal" data-anniv-title></h2>
        <p class="lead reveal" data-anniv-body></p>
        <p class="periode reveal" data-anniv-periode></p>
      </header>
      <div class="perks" data-anniv-items></div>
      <div class="center reveal">
        <a class="btn btn-solid" data-anniv-cta></a>
      </div>
    </div>
  </section>

  <!-- ============ CLOSING ============ -->
  <section class="section section-closing">
    <div class="shell narrow center">
      <h2 class="h2 display reveal" data-closing-title></h2>
      <p class="lead reveal" data-closing-body></p>
      <a class="btn btn-solid reveal" data-closing-cta></a>
    </div>
  </section>

  <!-- ============ KONTAK ============ -->
  <section class="section section-alt" id="kontak">
    <div class="shell">
      <header class="sec-head">
        <p class="eyebrow reveal" data-contact-eyebrow></p>
        <h2 class="h2 reveal" data-contact-title></h2>
      </header>
      <div class="contact" data-contact></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="shell footer-inner">
    <div>
      <p class="logo-mark">SOJI</p>
      <p class="muted" data-brand-tagline></p>
    </div>
    <p class="muted small">© <span data-year></span> SOJI. <span data-brand-periode></span></p>
  </div>
</footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
